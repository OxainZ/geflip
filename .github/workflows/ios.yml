name: ios-float

# Builds the iPhone app on a macOS runner, so no Mac is needed to develop it. The .ipa is
# UNSIGNED on purpose: AltStore/SideStore re-signs it on the phone with your own free Apple
# ID, which means no certificate or provisioning secret ever lives in this repo.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-float-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, not committed — see ios/project.yml.
      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project GeflipFloat.xcodeproj \
            -target GeflipFloat \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          test -d out/GeflipFloat.app
          mkdir -p Payload
          cp -R out/GeflipFloat.app Payload/
          zip -qry GeflipFloat.ipa Payload
          ls -la GeflipFloat.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: geflip-float-unsigned-ipa
          path: ios/GeflipFloat.ipa
          if-no-files-found: error
