name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pwsh7:
    name: PowerShell 7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22 -Scope CurrentUser -Force
      - name: Lint
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./host -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($findings.Count -gt 0) { throw "$($findings.Count) analyzer finding(s)" }
      - name: Test
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $cfg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-pwsh7-${{ matrix.os }}
          path: testResults.xml

  winps51:
    name: Windows PowerShell 5.1 (the floor)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5 for Windows PowerShell
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Parse every script with the 5.1 parser
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in (Get-ChildItem ./host -Recurse -Include *.ps1,*.psm1)) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e.Count -gt 0) { $bad++; $e | ForEach-Object { Write-Host "$($f.Name): $($_.Message)" } }
          }
          if ($bad -gt 0) { throw "$bad file(s) failed to parse under Windows PowerShell 5.1" }
      - name: Test under 5.1
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      - name: Dry-run the installer (WhatIf, no Sunshine present)
        shell: powershell
        run: |
          # On a clean runner Sunshine, Jagex Launcher and RuneLite are absent, so the
          # installer must stop with a clear message rather than a stack trace.
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -Command "& './host/Install-PocketLite.ps1' -NoWinget -NoTailscale -WhatIf" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Sunshine is not installed and -NoWinget was given') { throw 'Expected the -NoWinget guard message' }
