/*
 * geflip RuneLite plugin — build file (standard external-plugin layout).
 * Build:   ./gradlew build
 * Sideload: copy build/libs/*.jar into ~/.runelite/sideloaded-plugins/ (or use the
 *           RuneLite "Plugin Developer" flow). See README.md.
 */
plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    compileOnly 'com.google.code.gson:gson:2.8.9'

    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

group = 'com.geflip'
version = '1.0.0'
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The sideloader reads runelite-plugin.properties FROM THE JAR to find the plugin
// class (plugins=com.geflip.GeflipPlugin). It lives at the project root, so bundle
// it into the jar root explicitly — without it, dev-mode RuneLite skips the plugin.
jar {
    from('.') {
        include 'runelite-plugin.properties'
    }
}

// Headless proof-of-life: runs the fetch+score pipeline against the live wiki API.
// RuneLite is compileOnly, so add it to the run classpath here.
tasks.register('runCli', JavaExec) {
    group = 'verification'
    description = 'Run GeflipCli against the live wiki API (no game needed)'
    classpath = sourceSets.main.runtimeClasspath + configurations.compileClasspath
    mainClass = 'com.geflip.GeflipCli'
}

tasks.register('runBridge', JavaExec) {
    group = 'verification'
    description = 'Start the local bridge server with mock state (no game needed)'
    classpath = sourceSets.main.runtimeClasspath + configurations.compileClasspath
    mainClass = 'com.geflip.GeflipServer'
}

// THE way to run a custom external plugin in RuneLite: launch the real client with the
// plugin registered via loadBuiltin (GeflipPluginTest). Uses the test classpath, which
// carries the runelite-client at runtime. Auth comes from .runelite/credentials.properties.
tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launch RuneLite with the Geflip plugin loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.geflip.GeflipPluginTest'
    jvmArgs = ['-ea']   // RuneLite's loadBuiltin() refuses to run without assertions
}
