# PocketLite phone profile for RuneLite
# ------------------------------------
# Import this file ONCE through RuneLite: wrench icon (Configuration) ->
# profile icon at the top -> "Import Profile" -> pick this file. RuneLite
# creates a profile called "Imported Profile"; rename it to "Phone" and
# switch to it when you play from the iPhone, back to your normal profile
# at the desk. Nothing here is applied to your existing profile.
#
# Format is RuneLite's own: <configGroup>.<key>=<value>, enums by name,
# booleans as true/false, keybinds as keyCode:modifiers.
#
# Key names were checked against runelite/runelite master on 2026-10-14:
#   runelite-client/.../plugins/stretchedmode/StretchedModeConfig.java
#   runelite-client/.../config/RuneLiteConfig.java
#   runelite-client/.../plugins/PluginManager.java (plugin enable key format)

# Marker so Verify-PocketLite.ps1 can tell the profile has been imported.
# RuneLite stores unknown groups untouched.
pocketlite.marker=1

# --- Stretched Mode: the single biggest readability win on a 6.3" screen ---
# Plugin enable keys are "runelite.<pluginclass lowercase>".
runelite.stretchedmodeplugin=true
# "Resizable scaling": in resizable mode the game canvas is reduced by this
# percentage before being stretched back to the window, and RuneLite floors
# the result at the fixed-mode size (765x503). Higher = bigger UI. Default
# is 50. 60-75 reads well on a 6.3" screen at a 1080p stream; tune it live
# in the plugin panel while connected from the phone.
stretchedmode.scalingFactor=65
stretchedmode.keepAspectRatio=false
stretchedmode.integerScaling=false
# Leave off: it lowers quality for a performance gain the PC does not need.
stretchedmode.increasedPerformance=false

# --- Client window ---
# Let RuneLite grow/shrink with the window Sunshine streams; never pin it.
runelite.lockWindowSize=false
runelite.automaticResizeType=KEEP_GAME_SIZE
runelite.containInScreen2=RESIZING
runelite.rememberScreenBounds=true
runelite.gameAlwaysOnTop=false

# --- Overlays: larger infoboxes, tooltips away from the finger ---
runelite.infoBoxSize=50
runelite.tooltipPosition=ABOVE_CURSOR
runelite.infoBoxTextOutline=true

# --- Notifications: the PC may be in another room; stop it stealing focus ---
runelite.notificationRequestFocus=OFF
runelite.flashNotification=DISABLED
